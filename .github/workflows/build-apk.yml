name: build-apk
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Stage Python runtime + source (termux debs)
        run: bash scripts/fetch-and-stage.sh

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify staged runtime is inside the APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" > apk.txt
          fail=0
          grep -q "assets/bin/python3.14" apk.txt || { echo "MISSING python3.14 binary"; fail=1; }
          grep -q "assets/lib/libpython3.14.so" apk.txt || { echo "MISSING libpython3.14.so"; fail=1; }
          grep -q "assets/lib/python3.14/os.py" apk.txt || { echo "MISSING stdlib"; fail=1; }
          grep -q "assets/app/wb_proxy.py" apk.txt || { echo "MISSING wb_proxy.py"; fail=1; }
          grep -q "assets/app/dashboard.html" apk.txt || { echo "MISSING dashboard.html"; fail=1; }
          # underscore-prefixed dirs are silently dropped by AGP unless aaptOptions is overridden
          grep -q "assets/lib/python3.14/compression/_common/_streams.py" apk.txt || { echo "MISSING compression/_common"; fail=1; }
          grep -q "assets/lib/python3.14/zipfile/_path/glob.py" apk.txt || { echo "MISSING zipfile/_path"; fail=1; }
          # top-level libs only (no subdir) - the real closure the loader needs
          top=$(grep -cE "assets/lib/[^/]+\.so[^/]*$" apk.txt || true)
          echo "top-level shared libs: $top"
          for L in libssl.so.3 libcrypto.so.3 libz.so.1 libsqlite3.so libexpat.so.1 libffi.so liblzma.so.5 libbz2.so.1.0 libandroid-support.so; do
            grep -qE "assets/lib/$L$" apk.txt || { echo "MISSING lib: $L"; fail=1; }
          done
          [ "$top" -ge 15 ] || { echo "TOO FEW top-level libs: $top"; fail=1; }
          echo "dynload modules: $(grep -c 'lib-dynload/' apk.txt || true)"
          [ "$fail" -eq 0 ] || exit 1
          echo "RUNTIME OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wb-hub-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
